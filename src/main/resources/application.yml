spring:
  application:
    name: dio-speech-ai

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # ── Cache v2.3.0 ────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # timeout de conexão/leitura — falha rápida, não bloqueia o request
      connect-timeout: 2s
      timeout: 2s			

whisper:
  base-url: ${WHISPER_BASE_URL:http://localhost:8000}
  model: ${WHISPER_MODEL:Systran/faster-whisper-small}

# ── Cache v2.4.0 ────────────────────────────────────────────────────────────
cache:
  transcription:
    ttl-hours: ${CACHE_TTL_HOURS:24}   # TTL das transcrições no Redis

# ── Observabilidade v2.1.0 ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
 
  endpoint:
    health:
      show-details: always   # exibe detalhes de cada indicador de saúde
  
  health:
    circuitbreakers:
      enabled: true
    
  # Habilita histogramas de percentil para latência HTTP
  # Permite queries p50, p95, p99 no Prometheus/Grafana
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
      # Percentis pré-calculados (mais leves que histogramas completos)
      percentiles:
        '[http.server.requests]': 0.5, 0.95, 0.99
 
    # Tags globais adicionadas a TODAS as métricas desta aplicação
    tags:
      application: ${spring.application.name}

  # ── Tracing v2.7.0 ──────────────────────────────────────────────────────
  tracing:
    sampling:
      # 100% das requisições tracejadas em prod (ajustar para 0.1 em alta carga)
      probability: ${TRACING_SAMPLING:1.0}
 
# ── Zipkin v2.7.0 ──────────────────────────────────────────────────────────
    export:
      zipkin:
        endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411/api/v2/spans}

# ── Resiliência v3.1.0 / v3.2.0 ─────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      whisper:
        # Janela deslizante: conta as últimas 10 chamadas
        slidingWindowSize: 10
        # Abre o circuito se ≥ 50% das chamadas falharem
        failureRateThreshold: 50
        # Permanece aberto por 30s antes de tentar HALF_OPEN
        waitDurationInOpenState: 30s
        # Permite 3 chamadas de teste no estado HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        # Mínimo de chamadas antes de calcular a taxa de falha
        minimumNumberOfCalls: 5
        # Expõe estado no /actuator/health
        registerHealthIndicator: true
        # Considera lentidão > 10s como falha
        slowCallDurationThreshold: 10s
        slowCallRateThreshold: 80

# ── Retry v3.2.0 ──────────────────────────────────────────────────────────
  retry:
    instances:
      whisper:
        # 3 tentativas totais (1 original + 2 retries)
        maxAttempts: 3
        # Espera inicial entre tentativas
        waitDuration: 500ms
        # Backoff exponencial: 500ms → 1s → 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Limite máximo do backoff — evita espera infinita
        exponentialMaxWaitDuration: 4s
        # Retry APENAS em erros de I/O — não em erros de validação do cliente
        retryExceptions:
          - com.example.diospeechai.transcription.exception.TranscriptionException
        # Nunca fazer retry em erros de negócio/validação
        ignoreExceptions:
          - com.example.diospeechai.transcription.exception.ServiceUnavailableException
          - java.lang.IllegalArgumentException

# ── Logging v2.2.0 ──────────────────────────────────────────────────────────
# O logback-spring.xml controla o formato (JSON em prod, texto em dev).
# Aqui apenas definimos os níveis globais.
logging:
  level:
    root: INFO
    '[com.example.diospeechai]': INFO
