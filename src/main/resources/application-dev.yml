spring:
  config:
    activate:
      on-profile: dev
 
  data:
    redis:
      host: localhost
      port: 6379
 
cache:
  transcription:
    ttl-hours: 1
 
management:
  tracing:
    sampling:
      probability: 1.0
 
resilience4j:
  circuitbreaker:
    instances:
      whisper:
        # Janela menor em dev para facilitar testes do comportamento
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 10s

  retry:
    instances:
      whisper:
        maxAttempts: 2
        waitDuration: 200ms
        enableExponentialBackoff: false   # espera fixa em dev
 
logging:
  level:
    root: INFO
    '[com.example.diospeechai]': DEBUG
    '[io.github.resilience4j]': DEBUG