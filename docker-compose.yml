services:

  # ── Speaches (Whisper) ───────────────────────────────────────────────────────
  speaches:
    container_name: speaches
    # imagem com suporte a CUDA
    image: ghcr.io/speaches-ai/speaches:latest-cuda

    # build opcional (caso queira customizar base CUDA)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.6.3-base-ubuntu24.04
      platforms:
        - linux/amd64
        - linux/arm64

    restart: unless-stopped
    ports:
      - "8000:8000"

    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

    env_file:
      - path: .env
        required: false

    networks:
      - backend

    # suporte a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # hot reload (dev)
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ── Redis ────────────────────────────────────────────────────────────────────
  # v2.3.0 — cache de transcrições por hash SHA-256 (implementado em v2.4.0)
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped

    ports:
      - "6379:6379" # exposto apenas para inspeção local (redis-cli)

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes # persistência AOF

    networks:
      - backend

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API Spring Boot ──────────────────────────────────────────────────────────
  dio-speaches-ai:
    container_name: dio-speaches-ai

    build:
      context: .
      dockerfile: docker/Dockerfile

    ports:
      - "8080:8080"

    environment:
      WHISPER_BASE_URL: http://speaches:8000
      WHISPER_MODEL: Systran/faster-whisper-small
      REDIS_HOST: redis # aponta para o serviço redis na rede interna
      REDIS_PORT: 6379

    depends_on:
      speaches:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # v2.1.0 — coleta métricas da API via /actuator/prometheus a cada 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090" # UI: http://localhost:9090

    volumes:
      # Arquivo de configuração com jobs de scraping
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # permite reload via POST /-/reload

    depends_on:
      dio-speaches-ai:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

volumes:
  hf-hub-cache:
  prometheus_data:
  redis_data:


networks:
  backend:
