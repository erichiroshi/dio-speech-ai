services:

  # ── Speaches (Whisper) ───────────────────────────────────────────────────────
  speaches:
    container_name: speaches
    # imagem com suporte a CUDA
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped

    # build opcional (caso queira customizar base CUDA)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.6.3-base-ubuntu24.04
      platforms:
        - linux/amd64
        - linux/arm64

    ports:
      - "8000:8000"

    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

    env_file:
      - path: .env
        required: false

    # suporte a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # hot reload (dev)
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  # v2.3.0 — cache de transcrições por hash SHA-256 (implementado em v2.4.0)
  redis:
    container_name: redis
    image: redis:8.6.2-alpine
    restart: unless-stopped

    ports:
      - "6379:6379" # exposto apenas para inspeção local (redis-cli)

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes # persistência AOF

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - backend

  # ── Serviço RabbitMQ ──────────────────────────────────────────────────────────
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    restart: unless-stopped

    ports:
      - "5672:5672"    # AMQP — conexão da aplicação
      - "15672:15672"  # Management UI — http://localhost:15672 (admin/admin)

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - backend

  # ── Ollama (dev) ────────────────────────────────────────────────────
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped

    ports:
      - "11434:11434"		# API REST do Ollama

    volumes:
      - ollama_data:/root/.ollama		 # modelos persistidos entre restarts

    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # Se tiver GPU NVIDIA, adicionar:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    runtime: nvidia

    # Faz o pull do modelo e depois inicia o servidor
    entrypoint: ["/usr/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull llama3.2:1b && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  # ── API Spring Boot ──────────────────────────────────────────────────────────
  dio-speaches-ai:
    container_name: dio-speaches-ai

    build:
      context: .
      dockerfile: docker/Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      WHISPER_BASE_URL: http://speaches:8000
      WHISPER_MODEL: Systran/faster-whisper-small
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_HOURS: 24
      TRACING_SAMPLING: 1.0
      ZIPKIN_BASE_URL: http://zipkin:9411/api/v2/spans
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b

    depends_on:
      speaches:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - backend

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # v2.1.0 — coleta métricas da API via /actuator/prometheus a cada 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    user: "root"
    restart: unless-stopped

    ports:
      - "9090:9090" # UI: http://localhost:9090

    volumes:
      # Arquivo de configuração com jobs de scraping
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # permite reload via POST /-/reload

    depends_on:
      dio-speaches-ai:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # v2.6.0 — dashboards com provisioning automático (datasource + dashboard JSON)
  grafana:
    container_name: grafana
    image: 	grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3000:3000" # UI: http://localhost:3000  (admin/admin no primeiro acesso)

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dio-speech-ai.json

    volumes:
      # Provisioning automático: datasource Prometheus + dashboard JSON
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

# ── Zipkin ───────────────────────────────────────────────────────────────────
# v2.7.0 — coleta e visualiza traces distribuídos (OpenTelemetry → Zipkin)
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: unless-stopped

    ports:
      - "9411:9411"   # UI + API: http://localhost:9411

    healthcheck:
       test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
       interval: 20s
       timeout: 10s
       retries: 3
       start_period: 10s

    networks: 
      - backend

volumes:
  hf-hub-cache:
  prometheus_data:
  redis_data:
  grafana_data:
  rabbitmq_data:
  ollama_data:

networks:
  backend:
