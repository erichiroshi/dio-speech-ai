name: Release

on:
  push:
    tags:
      - 'v*'           # dispara em qualquer tag v1.0.0, v5.3.0, etc.

jobs:

  release:
    name: Release — re-tag imagem + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write    # necessário para criar GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extrair versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Login Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag imagem (latest → versão específica)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dio-speech-ai
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Reutiliza a imagem já buildada pelo docker.yml — não rebuilda
          docker pull $IMAGE:latest
          docker tag  $IMAGE:latest $IMAGE:$VERSION
          docker push $IMAGE:$VERSION
          echo "Imagem tagueada: $IMAGE:$VERSION"
