services:

  # ── Speaches (Whisper) ───────────────────────────────────────────────────────
  speaches:
    container_name: speaches
    # imagem com suporte a CUDA
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

    env_file:
      - path: .env
        required: false

    # suporte a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # hot reload (dev)
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  # v2.3.0 — a app local (./gradlew bootRun) conecta via localhost:6379
  redis:
    container_name: redis
    image: redis:8.6.2-alpine
    restart: unless-stopped

    ports:
      - "6379:6379" # exposto no host para a app local conectar

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - backend

  # ── Serviço RabbitMQ (dev) ────────────────────────────────────────────────────
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"  # http://localhost:15672 (admin/admin)

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - backend	  

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # v2.1.0 — coleta métricas da API via /actuator/prometheus a cada 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    user: "root"
    restart: unless-stopped

    ports:
      - "9090:9090" # UI: http://localhost:9090

    volumes:
      - ./monitoring/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs: /prometheus

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # v2.6.0 — dashboards com provisioning automático (datasource + dashboard JSON)
  grafana:
    container_name: grafana
    image: 	grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3000:3000" # UI: http://localhost:3000  (admin/admin no primeiro acesso)

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dio-speech-ai.json

    volumes:
      # Provisioning automático: datasource Prometheus + dashboard JSON
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

  # ── Zipkin ───────────────────────────────────────────────────────────────────
  # app local envia traces para host.docker.internal:9411 → não funciona
  # usar ZIPKIN_BASE_URL=http://localhost:9411 passado via env da IDE/bootRun
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: unless-stopped

    ports:
      - "9411:9411"

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - backend

  # ── SonarQube ───────────────────────────────────────────────────────────────────
  sonarqube:
    container_name: sonarqube
    image: sonarqube:latest
    restart: unless-stopped

    ports:
      - "9000:9000" # UI: http://localhost:9000  (admin/admin no primeiro acesso)

    # Mapeando os diretórios para volumes com nomes fixos
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/system/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - backend

volumes:
  hf-hub-cache:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
  rabbitmq_data:

networks:
  backend:
