services:

  # ── Speaches (Whisper) ───────────────────────────────────────────────────────
  speaches:
    container_name: speaches
    # imagem com suporte a CUDA
    image: ghcr.io/speaches-ai/speaches:latest-cuda

    restart: unless-stopped
    ports:
      - "8000:8000"

    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

    env_file:
      - path: .env
        required: false

    networks:
      - backend

    # suporte a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # hot reload (dev)
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ── Redis ────────────────────────────────────────────────────────────────────
  # v2.3.0 — a app local (./gradlew bootRun) conecta via localhost:6379
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped

    ports:
      - "6379:6379" # exposto no host para a app local conectar

    networks:
      - backend

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # v2.1.0 — coleta métricas da API via /actuator/prometheus a cada 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090" # UI: http://localhost:9090

    volumes:
      # Arquivo de configuração com jobs de scraping
      - ./monitoring/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus-dev.yml:ro

    command:
      - '--config.file=/etc/prometheus/prometheus-dev.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # permite reload via POST /-/reload

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

volumes:
  hf-hub-cache:


networks:
  backend:
