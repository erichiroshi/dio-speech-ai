services:

  # ── Speaches (Whisper) ───────────────────────────────────────────────────────
  speaches:
    container_name: speaches
    # imagem com suporte a CUDA
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

    env_file:
      - path: .env
        required: false

    # suporte a GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # hot reload (dev)
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  # v2.3.0 — a app local (./gradlew bootRun) conecta via localhost:6379
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped

    ports:
      - "6379:6379" # exposto no host para a app local conectar

    volumes:
      - redis-dev_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - backend

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # v2.1.0 — coleta métricas da API via /actuator/prometheus a cada 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090" # UI: http://localhost:9090

    volumes:
      # Arquivo de configuração com jobs de scraping
      - ./monitoring/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus-dev.yml:ro
      - prometheus-dev_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus-dev.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # permite reload via POST /-/reload

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # v2.6.0 — dashboards com provisioning automático (datasource + dashboard JSON)
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3000:3000" # UI: http://localhost:3000  (admin/admin no primeiro acesso)

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dio-speech-ai.json

    volumes:
      # Provisioning automático: datasource Prometheus + dashboard JSON
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      - grafana-dev_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - backend

volumes:
  hf-hub-cache:
  redis-dev_data:
  prometheus-dev_data:
  grafana-dev_data:


networks:
  backend:
