global:
  scrape_interval: 10s       # coleta métricas a cada 10 segundos
  evaluation_interval: 10s   # avalia regras a cada 10 segundos

scrape_configs:
  - job_name: 'dio-speech-ai'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'dio-speech-ai'
          environment: 'dev'