
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap — dio-speech-ai</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .phase-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px;
      cursor: pointer; user-select: none;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 2px;
    }
    .phase-header:hover { background: #1a2234; }
    .phase-badge {
      font-size: 11px; font-weight: 600; padding: 2px 10px;
      border-radius: 99px; white-space: nowrap;
    }
    .phase-title { font-size: 14px; font-weight: 500; flex: 1; color: var(--text); }
    .phase-meta { font-size: 12px; color: var(--muted); }
    .chevron { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
    .chevron.open { transform: rotate(90deg); }

    .tasks { overflow: hidden; transition: max-height 0.3s ease; }
    .task-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 14px 8px 28px;
      border-left: 1.5px solid var(--border);
      margin-left: 18px;
      cursor: pointer;
    }
    .task-item:hover { background: #1a2234; border-radius: 0 8px 8px 0; }
    .task-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .task-body { flex: 1; }
    .task-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .task-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
    .task-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .tag {
      font-size: 11px; padding: 1px 7px; border-radius: 99px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .detail-panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-top: 12px; font-size: 13px;
    }
    .detail-panel h3 { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
    .detail-panel p { color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
    .code-block {
      background: #020617; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px; color: #86efac;
      overflow-x: auto; margin-top: 6px; line-height: 1.6;
    }
    .dep-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .dep-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #0c2a1a; color: #22c55e; border: 1px solid #14532d;
    }
    .close-btn { float: right; font-size: 12px; color: var(--muted); cursor: pointer; padding: 0 4px; }
    .close-btn:hover { color: var(--text); }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .done-badge {
      font-size: 10px; font-weight: 600; padding: 1px 7px;
      border-radius: 99px; background: #0c2a1a; color: #22c55e;
      border: 1px solid #14532d; margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">Home</a>
      <a href="architecture.html">Arquitetura</a>
      <a href="observability.html">Observabilidade</a>
      <a href="resilience.html">Resiliência</a>
      <a href="https://github.com/erichiroshi/dio-speech-ai/blob/main/README.md">README</a>
    </nav>

    <h1 style="font-size:1.8rem; margin: 24px 0 6px;">Roadmap — dio-speech-ai</h1>
    <p class="hint">Clique em uma fase para expandir · Clique em uma tarefa para ver detalhes</p>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#1D9E75"></div>Fase 1 — concluída (v1.0.0)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div>Fase 2 — concluída (v2.7.0)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7F77DD"></div>Fase 3 — concluída (v3.4.0)</div>
    </div>

    <div id="phases"></div>
    <div id="detail-container"></div>

    <footer style="margin-top: 40px;">
      <p>Desenvolvido por Eric Hiroshi</p>
    </footer>
  </div>

<script>
const phases = [
  {
    id: 1, label: "Fase 1", title: "Base — API de transcrição",
    color: "#1D9E75", badgeBg: "#0c2a1a", badgeColor: "#22c55e",
    version: "v1.0.0", taskCount: 4, done: true,
    tasks: [
      { title: "API REST síncrona", desc: "POST /api/transcriptions com multipart/form-data", tags: ["Spring MVC", "WebFlux"], done: true },
      { title: "Integração com Whisper via Speaches", desc: "WebClient → POST /v1/audio/transcriptions", tags: ["WebClient", "Speaches"], done: true },
      { title: "Validação e tratamento de erros", desc: "ProblemDetail (RFC 9457), tipos permitidos, tamanho", tags: ["GlobalExceptionHandler"], done: true },
      { title: "Infraestrutura Docker Compose", desc: "app + speaches, healthcheck, dependência ordenada", tags: ["Docker", "Healthcheck"], done: true }
    ]
  },
  {
    id: 2, label: "Fase 2", title: "Observabilidade + Cache",
    color: "#185FA5", badgeBg: "#0a1929", badgeColor: "#60a5fa",
    version: "v2.7.0", taskCount: 7, done: true,
    tasks: [
      {
        title: "2.1 — Micrometer + Prometheus",
        desc: "Métricas expostas em /actuator/prometheus, container Prometheus no Compose",
        tags: ["Micrometer", "Prometheus", "Actuator"],
        done: true,
        version: "v2.1.0",
        detail: "Dependência micrometer-registry-prometheus adicionada. TranscriptionMetrics centraliza: Counter (success/error), Timer (whisper.duration p50/p95/p99), DistributionSummary (file.size.bytes). Container prometheus no docker-compose.yml (prod) e docker-compose.dev.yml (scrape via host.docker.internal). Perfil dev: ./gradlew bootRun + docker-compose.dev.yml.",
        snippet: "// build.gradle\nimplementation 'io.micrometer:micrometer-registry-prometheus'\n\n// TranscriptionMetrics.java\nCounter successCounter = Counter.builder(\"transcription.requests.total\")\n    .tag(\"status\", \"success\").register(registry);\nTimer whisperTimer = Timer.builder(\"transcription.whisper.duration\")\n    .publishPercentiles(0.5, 0.95, 0.99).register(registry);"
      },
      {
        title: "2.2 — Logs estruturados (JSON)",
        desc: "logstash-logback-encoder + logback-spring.xml + MdcLoggingFilter com requestId por request",
        tags: ["Logback", "JSON", "MDC"],
        done: true,
        version: "v2.2.0",
        detail: "logback-spring.xml com dois perfis: prod → JSON (campos MDC de primeiro nível), dev → texto colorido. MdcLoggingFilter popula requestId (UUID), httpMethod, requestUri. TranscriptionService adiciona fileName, fileSizeBytes, whisperModel. GlobalExceptionHandler inclui requestId no ProblemDetail. Header X-Request-Id em todas as respostas.",
        snippet: "// build.gradle\nimplementation 'net.logstash.logback:logstash-logback-encoder:9.0'\n\n// Log JSON gerado em prod:\n{\n  \"level\": \"INFO\",\n  \"message\": \"Transcrição concluída | chars=142\",\n  \"requestId\": \"a3f2c1d0-...\",\n  \"fileName\": \"audio.wav\",\n  \"fileSizeBytes\": \"461842\",\n  \"whisperModel\": \"Systran/faster-whisper-small\"\n}"
      },
      {
        title: "2.3 — Redis no Docker Compose",
        desc: "Subir container Redis e configurar Spring Data Redis na aplicação",
        tags: ["Redis", "Docker Compose", "Spring Data Redis"],
        done: true,
        version: "v2.3.0",
        detail: "Adicionar serviço redis no compose.yaml. Adicionar dependência spring-boot-starter-data-redis. Configurar RedisTemplate com serializer Jackson. Expor porta 6379 apenas na rede backend.",
        snippet: "# docker-compose.yml\nredis:\n  image: redis:7-alpine\n  healthcheck:\n    test: [\"CMD\",\"redis-cli\",\"ping\"]\n\n// build.gradle\nimplementation 'org.springframework.boot:spring-boot-starter-data-redis'"
      },
      {
        title: "2.4 — Cache por hash SHA-256",
        desc: "Calcular hash do arquivo e cachear transcrição em transcription:{hash}",
        tags: ["SHA-256", "Redis", "Cache"],
        done: true,
        version: "v2.4.0",
        detail: "Criar CacheService que calcula SHA-256 do byte[] antes de enviar ao Whisper. Chave Redis: transcription:{sha256hex}. TTL configurável. Hit → retorna imediatamente com cached:true. Miss → transcreve, armazena, retorna.",
        snippet: "String hash = DigestUtils.sha256Hex(file.getBytes());\nString key = \"transcription:\" + hash;\nTranscriptionResponse cached = redisTemplate.opsForValue().get(key);\nif (cached != null) return cached.withCached(true);\n\n// após transcrever:\nredisTemplate.opsForValue().set(key, response, Duration.ofHours(24));"
      },
      {
        title: "2.5 — Métricas customizadas de cache",
        desc: "Contadores cache.hit / cache.miss integrados ao TranscriptionMetrics",
        tags: ["Micrometer", "Counter", "Cache"],
        done: true,
        version: "v2.5.0",
        detail: "Expandir TranscriptionMetrics com: Counter transcription.cache{result=hit}, Counter transcription.cache{result=miss}. Adicionar tag 'model' nas métricas do Whisper. Cache hit ratio visível no Prometheus: hits/(hits+misses).",
        snippet: "Counter hitCounter = Counter.builder(\"transcription.cache\")\n    .tag(\"result\",\"hit\").register(registry);\nCounter missCounter = Counter.builder(\"transcription.cache\")\n    .tag(\"result\",\"miss\").register(registry);\n\n// Prometheus query:\n// rate(transcription_cache_total{result=\"hit\"}[1m])"
      },
      {
        title: "2.6 — Grafana + dashboards",
        desc: "Dashboard com: req/s, latência p50/p95/p99, cache hit rate, erros",
        tags: ["Grafana", "Prometheus", "Dashboard"],
        done: true,
        version: "v2.6.0",
        detail: "Adicionar serviço grafana no compose.yaml com provisioning automático via volumes. Datasource prometheus.yaml apontando para http://prometheus:9090. Dashboard JSON com: throughput (req/min), percentis de latência, cache hit ratio, distribuição de tamanhos.",
        snippet: "# docker-compose.yml\ngrafana:\n  image: grafana/grafana\n  volumes:\n    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning\n  ports: [\"3000:3000\"]"
      },
      {
        title: "2.7 — Tracing com Zipkin (OpenTelemetry)",
        desc: "Trace IDs por todo fluxo: controller → service → redis → whisper",
        tags: ["Zipkin", "OpenTelemetry", "Micrometer Tracing"],
        done: true,
        version: "v2.7.0",
        detail: "Adicionar micrometer-tracing-bridge-otel e opentelemetry-exporter-zipkin. Container zipkin no compose. Sampling 100% em dev. O trace_id aparece automaticamente nos logs JSON via MDC.",
        snippet: "// build.gradle\nimplementation 'io.micrometer:micrometer-tracing-bridge-otel'\nimplementation 'io.opentelemetry:opentelemetry-exporter-zipkin'\n\n// application.yml\nmanagement.tracing.sampling.probability: 1.0\nzipkin.base-url: http://zipkin:9411"
      }
    ]
  },
  {
    id: 3, label: "Fase 3", title: "Resiliência + Segurança (JWT)",
    color: "#7F77DD", badgeBg: "#1a1640", badgeColor: "#a5b4fc",
    version: null, taskCount: 5, done: true,
    version: "v3.5.0",
    tasks: [
      {
        title: "3.1 — CircuitBreaker (Resilience4j)",
        desc: "@CircuitBreaker no SpeechToTextClient — fallback com 503",
        tags: ["Resilience4j", "CircuitBreaker"],
        done: true,
        version: "v3.1.0",
        detail: "Adicionar spring-boot-starter-aop e resilience4j-spring-boot3. @CircuitBreaker(name='whisper') em SpeechToTextClient. Configurar: slidingWindowSize=10, failureRateThreshold=50, waitDuration=30s. Fallback: TranscriptionException com mensagem 'Whisper indisponível'.",
        snippet: "@CircuitBreaker(name = \"whisper\", fallbackMethod = \"fallback\")\npublic WhisperResponse transcribe(MultipartFile file) { ... }\n\n// application.yml\nresilience4j.circuitbreaker.instances.whisper:\n  slidingWindowSize: 10\n  failureRateThreshold: 50\n  waitDurationInOpenState: 30s"
      },
      {
        title: "3.2 — Retry com backoff exponencial",
        desc: "@Retry no cliente Whisper: 3 tentativas, backoff 500ms → 2s",
        tags: ["Resilience4j", "Retry", "Backoff"],
        done: true,
        version: "v3.2.0",
        detail: "@Retry junto com @CircuitBreaker (ordem importa: Retry wraps CB). maxAttempts=3, waitDuration=500ms, exponentialBackoff multiplier=2. Retry apenas em TranscriptionException, não em IllegalArgumentException.",
        snippet: "// application.yml\nresilience4j.retry.instances.whisper:\n  maxAttempts: 3\n  waitDuration: 500ms\n  enableExponentialBackoff: true\n  exponentialBackoffMultiplier: 2\n  retryExceptions:\n    - TranscriptionException"
      },
      {
        title: "3.3 — Métricas de resiliência",
        desc: "Estado do circuit breaker e tentativas de retry no Prometheus",
        tags: ["Micrometer", "Resilience4j", "Prometheus"],
        done: true,
        version: "v3.3.0",
        detail: "Resilience4j integra automaticamente com Micrometer. Métricas: resilience4j_circuitbreaker_state (CLOSED/OPEN/HALF_OPEN), _calls_total, resilience4j_retry_calls_total. Painel Grafana: gauge do estado do CB + taxa de retries.",
        snippet: "# Prometheus\nresilience4j_circuitbreaker_state{name=\"whisper\"}\nrate(resilience4j_circuitbreaker_calls_total{name=\"whisper\",kind=\"failed\"}[1m])"
      },
      {
        title: "3.4 — Spring Security + JWT",
        desc: "Filtro JWT stateless — /api/transcriptions exige ROLE_USER",
        tags: ["Spring Security", "JWT", "Stateless"],
        done: true,
        version: "v3.4.0",
        detail: "spring-boot-starter-security + nimbus-jose-jwt. JwtAuthFilter extends OncePerRequestFilter. SecurityFilterChain: SESSION=STATELESS, /actuator/health e /auth/token públicos. Endpoint POST /auth/token (dev) gera token com sub, roles, exp.",
        snippet: "@Bean SecurityFilterChain chain(HttpSecurity http) {\n  return http\n    .sessionManagement(s -> s.sessionCreationPolicy(STATELESS))\n    .authorizeHttpRequests(a -> a\n      .requestMatchers(\"/actuator/health\",\"/auth/token\").permitAll()\n      .anyRequest().authenticated())\n    .addFilterBefore(jwtFilter, ...)\n    .csrf(AbstractHttpConfigurer::disable)\n    .build();\n}"
      },
      {
        title: "3.5 — Testes de integração",
        desc: "Testcontainers: cache hit/miss, CB open/close, JWT válido/inválido",
        tags: ["JUnit 5", "Testcontainers", "SpringBootTest"],
        done: true,
        version: "v3.5.0",
        detail: "Testcontainers para Redis e Zipkin. Cenários: cache hit retorna cached=true; CB abre após N falhas → 503; retry reconecta na 2ª tentativa; JWT ausente → 401; JWT expirado → 401; JWT válido → 200.",
        snippet: "@Container\nstatic RedisContainer redis = new RedisContainer(\"redis:7-alpine\");\n\n@Test void shouldReturnCachedTranscription() {\n  // 1ª chamada: miss → chama Whisper\n  // 2ª chamada: hit → Redis, cached=true\n}"
      }
    ]
  }
];

let openPhases = new Set([3]);
let activeTask = null;

function renderPhases() {
  const container = document.getElementById('phases');
  container.innerHTML = '';
  phases.forEach(phase => {
    const isOpen = openPhases.has(phase.id);
    const wrapper = document.createElement('div');
    wrapper.style.marginBottom = '8px';

    const doneBadge = phase.done ? `<span class="done-badge">✓ concluída</span>` : '';
    const versionBadge = phase.version ? `<span style="font-size:11px;color:#60a5fa;margin-left:4px">${phase.version}</span>` : '';

    const header = document.createElement('div');
    header.className = 'phase-header';
    header.innerHTML = `
      <span class="phase-badge" style="background:${phase.badgeBg};color:${phase.badgeColor}">${phase.label}</span>
      <span class="phase-title">${phase.title}${doneBadge}${versionBadge}</span>
      <span class="phase-meta">${phase.taskCount} tarefas</span>
      <span class="chevron ${isOpen ? 'open' : ''}">▶</span>
    `;
    header.onclick = () => {
      if (openPhases.has(phase.id)) openPhases.delete(phase.id);
      else openPhases.add(phase.id);
      renderPhases();
    };

    const tasks = document.createElement('div');
    tasks.className = 'tasks';
    tasks.style.maxHeight = isOpen ? '3000px' : '0';

    phase.tasks.forEach((task, ti) => {
      const item = document.createElement('div');
      item.className = 'task-item';
      const isActive = activeTask && activeTask.phaseId === phase.id && activeTask.taskIdx === ti;
      if (isActive) item.style.background = '#0a1929';

      const vTag = task.version ? `<span style="font-size:10px;color:#22c55e;background:#0c2a1a;border:1px solid #14532d;padding:0 5px;border-radius:99px;margin-left:4px">${task.version} ✓</span>` : '';

      item.innerHTML = `
        <div class="task-dot" style="background:${phase.color}${task.done ? '' : '55'}"></div>
        <div class="task-body">
          <div class="task-title" style="${task.done ? 'text-decoration:line-through;color:#6b7280' : ''}">${task.title}${vTag}</div>
          <div class="task-desc">${task.desc}</div>
          ${task.tags ? `<div class="task-tags">${task.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
        </div>
      `;
      item.onclick = () => {
        if (task.detail) {
          activeTask = (isActive) ? null : { phaseId: phase.id, taskIdx: ti, task, phase };
          renderPhases();
          renderDetail();
        }
      };
      tasks.appendChild(item);
    });

    wrapper.appendChild(header);
    wrapper.appendChild(tasks);
    container.appendChild(wrapper);
  });
}

function renderDetail() {
  const container = document.getElementById('detail-container');
  if (!activeTask) { container.innerHTML = ''; return; }
  const { task } = activeTask;
  container.innerHTML = `
    <div class="detail-panel">
      <span class="close-btn" id="close-detail">✕</span>
      <h3>${task.title}</h3>
      <p>${task.detail}</p>
      ${task.deps ? `<div style="font-size:12px;color:#9ca3af;margin-bottom:6px">Dependências:</div><div class="dep-list">${task.deps.map(d=>`<span class="dep-tag">${d}</span>`).join('')}</div>` : ''}
      ${task.snippet ? `<div class="code-block"><pre style="white-space:pre-wrap">${task.snippet}</pre></div>` : ''}
    </div>
  `;
  document.getElementById('close-detail').onclick = () => { activeTask = null; renderPhases(); renderDetail(); };
}

renderPhases();
renderDetail();
</script>
</body>
</html>
