plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '2.5.0'
description = 'Serviço de transcrição de áudio'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencies {
	// ── Spring starter ──────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// ── Observabilidade v2.1.0 ──────────────────────────────────────────────
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// ── Observabilidade v2.2.0 — Logs estruturados ──────────────────────────
	// Serializa logs Logback em JSON com campos MDC como campos de primeiro nível
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
	
	// ── Cache v2.3.0 ────────────────────────────────────────────────────────
	// Spring Data Redis (Lettuce client embutido) + serialização Jackson
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// ── Lombok ─────────────────────────────────────────────────────────────
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
		
	//── Test ────────────────────────────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
