plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '7.2.3.7755'
}

group = 'com.example'
version = '8.1.0'
description = 'Serviço de transcrição de áudio'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext{
	logbackencoderVersion = '9.0'
	aopVersion            = '3.5.13'
	resilience4jVersion   = '2.4.0'
   	testcontainersVersion = '2.0.4'
   	okhttpVersion         = '5.3.2'
	springdocVersion      = '3.0.3'
	
	coverageExclusions = [
	'**/config/**',
	'**/dto/**',
	'**/exception/*Exception*',
	'**/*Application*',
	'**/documentation/**',
	'**/messaging/NoOp*',      // placeholder sem lógica testável
	'**/adapter/out/messaging/event/**' // DTO de evento — sem lógica
	]
}

dependencies {
	// ── Spring starter ──────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// ── Observabilidade v2.1.0 ──────────────────────────────────────────────
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// ── Observabilidade v2.2.0 — Logs estruturados ──────────────────────────
	// Serializa logs Logback em JSON com campos MDC como campos de primeiro nível
	implementation "net.logstash.logback:logstash-logback-encoder:${logbackencoderVersion}"
	
	// ── Cache v2.3.0 ────────────────────────────────────────────────────────
	// Spring Data Redis (Lettuce client embutido) + serialização Jackson
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// ── Tracing v2.7.0 ─────────────────────────────────────────────────────
	// Ponte Micrometer → OpenTelemetry SDK
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	// Exportador OTel → Zipkin (formato Zipkin v2 JSON sobre HTTP)
	implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
	implementation 'org.springframework.boot:spring-boot-starter-zipkin'

	// ── Resiliência v3.1.0 ──────────────────────────────────────────────────
	// AOP necessário para @CircuitBreaker, @Retry funcionar como anotações
	implementation "org.springframework.boot:spring-boot-starter-aop:${aopVersion}"
	// Resilience4j com autoconfigure para Spring Boot 4
	implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"

	// ── Documentação v4.1.0 ─────────────────────────────────────────────────
	// SpringDoc OpenAPI — gera spec OAS 3.1 e serve Swagger UI
	// Compatível com Spring Boot 4.x / Spring Framework 7
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// ── Mensageria v8.1.0 ────────────────────────────────────────────────────
	// Spring AMQP — integração com RabbitMQ (producer + consumer + DLQ)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
				
	// ── Lombok ─────────────────────────────────────────────────────────────
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
		
	//── Test ────────────────────────────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// ── Testes v3.5.0 ───────────────────────────────────────────────────────
	// BOM do Testcontainers — gerencia todas as versões dos módulos
	testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	// Módulo Redis para Testcontainers
	testImplementation 'com.redis:testcontainers-redis'
	// MockWebServer para simular o Speaches (Whisper) nos testes
	implementation platform("com.squareup.okhttp3:okhttp-bom:${okhttpVersion}")
	testImplementation 'com.squareup.okhttp3:mockwebserver'
	// RabbitMQ real nos testes de integração v8.3.0
	testImplementation 'org.testcontainers:rabbitmq:1.21.4'
}

// ── Jacoco v5.1.0 ────────────────────────────────────────────────────────────
 
jacoco {
	toolVersion = '0.8.14'
}

// Gera relatório após os testes (XML para SonarCloud/Codecov + HTML para leitura)
test.finalizedBy jacocoTestReport
 
jacocoTestReport {
	dependsOn test
	reports {
		xml.required  = true   // consumido pelo SonarCloud e Codecov
		html.required = true   // leitura local em build/reports/jacoco/
	}
	// Exclui classes que não têm lógica testável
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, excludes: 
				coverageExclusions
			)
		}))
	}
}
 
// Bloqueia o build se cobertura cair abaixo do threshold
// check (que roda antes do build final) depende desta verificação
check.dependsOn jacocoTestCoverageVerification
 
jacocoTestCoverageVerification {
	// Aplica as mesmas exclusões do relatório
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, excludes: 
				coverageExclusions
			)
		}))
	}
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value   = 'COVEREDRATIO'
				minimum = 0.70   // 70% de linhas cobertas — sobe gradualmente com os testes
			}
		}
	}
}
 
// ── Sonar v5.1.0 ─────────────────────────────────────────────────────────────
 
sonar {
	properties {
		property 'sonar.projectKey',  'erichiroshi_dio-speech-ai'
		property 'sonar.projectName', 'dio-speech-ai'
		property 'sonar.organization', 'erichiroshi'
		property 'sonar.host.url',    'https://sonarcloud.io'
		property 'sonar.java.coveragePlugin', 'jacoco'
		property 'sonar.coverage.jacoco.xmlReportPaths',
		         'build/reports/jacoco/test/jacocoTestReport.xml'
		// Exclui os mesmos arquivos do Jacoco
		property 'sonar.exclusions', coverageExclusions.join(',')
		property 'sonar.sources',     'src/main/java'
		property 'sonar.tests',       'src/test/java'
	}
}
 
tasks.named('test') {
	useJUnitPlatform()
	// Garante que Jacoco instrumente os testes
	finalizedBy jacocoTestReport
}
 
