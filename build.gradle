plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '3.1.0'
description = 'Serviço de transcrição de áudio'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext{
	logbackencoderVersion = '9.0'
	aopVersion = '3.5.13'
	resilience4jVersion = '2.4.0'
}

dependencies {
	// ── Spring starter ──────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// ── Observabilidade v2.1.0 ──────────────────────────────────────────────
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// ── Observabilidade v2.2.0 — Logs estruturados ──────────────────────────
	// Serializa logs Logback em JSON com campos MDC como campos de primeiro nível
	implementation "net.logstash.logback:logstash-logback-encoder:${logbackencoderVersion}"
	
	// ── Cache v2.3.0 ────────────────────────────────────────────────────────
	// Spring Data Redis (Lettuce client embutido) + serialização Jackson
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// ── Tracing v2.7.0 ─────────────────────────────────────────────────────
	// Ponte Micrometer → OpenTelemetry SDK
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	// Exportador OTel → Zipkin (formato Zipkin v2 JSON sobre HTTP)
	implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
	implementation 'org.springframework.boot:spring-boot-starter-zipkin'

	// ── Resiliência v3.1.0 ──────────────────────────────────────────────────
	// AOP necessário para @CircuitBreaker, @Retry funcionar como anotações
	implementation "org.springframework.boot:spring-boot-starter-aop:${aopVersion}"
	// Resilience4j com autoconfigure para Spring Boot 4
	implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"
	
	// ── Lombok ─────────────────────────────────────────────────────────────
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
		
	//── Test ────────────────────────────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
